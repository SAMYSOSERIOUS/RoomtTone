name: Build and deploy dashboard

# Runs on every push: practice data -> pipeline -> app/rt.js -> GitHub Pages.
# The live workflow (live.yml) replaces the practice data once you turn it on.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Tests
        run: python -m pytest -q
      - name: Practice run, all four sources
        run: |
          for s in bluesky mastodon reddit youtube; do python -m roomtone.collect --simulate --hours 72 --source $s; done
          python -m roomtone.pipeline bluesky mastodon reddit youtube
          python -m roomtone.rt_export
          python tools/unpack_design.py design/Roomtone_Dashboard.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
