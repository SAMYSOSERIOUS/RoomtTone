  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<script src=\"46c2da34-9687-4bbf-a304-c790fb10b7c1\"><\u002Fscript>\n<script src=\"a5491a26-eba4-45b5-8575-b88cc4689272\"><\u002Fscript>\n<script src=\"37ac5847-5887-41e6-a4c5-e861747fc766\"><\u002Fscript>\n<style>\nbody{margin:0;background:#eef1f4;color:#10161d;font-family:'IBM Plex Sans',system-ui,sans-serif;-webkit-font-smoothing:antialiased}\na{color:#2a78d6;text-decoration:none}a:hover{color:#10161d;text-decoration:underline}\nbutton{font-family:inherit}\n*{box-sizing:border-box}\n@keyframes rt-live{0%,100%{opacity:1}50%{opacity:.35}}\n@media (prefers-reduced-motion: reduce){*{transition-duration:0ms !important;animation:none !important}}\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<div style=\"min-height:100vh;background:#eef1f4\">\n\n<header style=\"background:#f8f9fb;border-bottom:1px solid rgba(16,22,29,.1);padding:0 clamp(16px,3vw,40px)\">\n  <div style=\"max-width:1440px;margin:0 auto;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px 24px;padding:14px 0\">\n    <div style=\"display:flex;align-items:baseline;gap:14px;flex-wrap:wrap\">\n      <div style=\"font-family:'Instrument Serif',serif;font-size:32px;line-height:1\">Roomtone<\u002Fdiv>\n      <div style=\"font-size:13px;color:#4d5966;text-wrap:balance;max-width:340px\">What a conversation sounds like when nobody real is in it<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:flex;align-items:center;gap:10px;flex-wrap:wrap\">\n      <div style=\"display:flex;align-items:center;gap:8px;font:500 12px 'IBM Plex Mono',monospace;color:#3b4652;padding:7px 11px;border:1px solid rgba(16,22,29,.14);border-radius:999px;white-space:nowrap\">\n        <span style=\"width:7px;height:7px;border-radius:50%;background:#2f9a5f;animation:rt-live 2.4s ease-in-out infinite\"><\u002Fspan>Live · hourly · last run {{ lastRun }}\n      <\u002Fdiv>\n      <a href=\"#feed\" style=\"font-size:13px;font-weight:500;color:#f3f6f9;background:#10161d;padding:8px 14px;border-radius:999px;white-space:nowrap\">Open the ghost-free feed<\u002Fa>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fheader>\n\n<div style=\"padding:16px clamp(16px,3vw,40px) 0\">\n  <div style=\"max-width:1440px;margin:0 auto;display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px\">\n    <div style=\"font:500 10.5px 'IBM Plex Mono',monospace;letter-spacing:.1em;text-transform:uppercase;color:#4d5966;white-space:nowrap\">Data source<\u002Fdiv>\n    <div style=\"display:flex;flex-wrap:wrap;gap:3px;background:#e1e6eb;border-radius:999px;padding:3px\">\n      <sc-for list=\"{{ srcSeg }}\" as=\"sg\" hint-placeholder-count=\"5\">\n        <button sc-camel-on-click=\"{{ sg.onClick }}\" style=\"cursor:pointer;display:flex;align-items:center;gap:7px;border:none;border-radius:999px;padding:7px 13px;font-size:13px;font-weight:500;background:{{ sg.bg }};color:{{ sg.color }};box-shadow:{{ sg.sh }};transition:background 300ms,color 300ms;white-space:nowrap\">\n          <span style=\"width:7px;height:7px;border-radius:50%;background:{{ sg.dot }};border:1px {{ sg.dotStyle }} {{ sg.dotBorder }}\"><\u002Fspan>{{ sg.name }}\n        <\u002Fbutton>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n    <div style=\"font-size:13px;color:#4d5966;text-wrap:pretty\">{{ srcNote }}<\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<section data-screen-label=\"Status strip\" style=\"padding:14px clamp(16px,3vw,40px) 24px\">\n  <div style=\"max-width:1440px;margin:0 auto;display:flex;flex-wrap:wrap;gap:16px;align-items:stretch\">\n\n    <div style=\"flex:1 1 380px;min-width:0;background:#0f1318;color:#e8edf2;border-radius:12px;overflow:hidden;display:flex;flex-direction:column;min-height:460px\">\n      <div style=\"padding:22px 24px 0;display:flex;flex-direction:column;gap:10px\">\n        <div style=\"display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap\">\n          <div style=\"font:500 10.5px 'IBM Plex Mono',monospace;letter-spacing:.12em;text-transform:uppercase;color:#9aa6b2;white-space:nowrap\">Wasted Breath · 24 h<\u002Fdiv>\n          <div style=\"font:500 10.5px 'IBM Plex Mono',monospace;color:#c9d2db;white-space:nowrap\">{{ srcShort }}<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex;align-items:baseline;gap:14px;flex-wrap:wrap\">\n          <div style=\"font-family:'Instrument Serif',serif;font-size:clamp(84px,7.4vw,116px);line-height:.9;letter-spacing:-.02em;color:#f3f6f9;white-space:nowrap\">1 in {{ oneIn }}<\u002Fdiv>\n          <div ref=\"{{ countRef }}\" style=\"font:500 20px 'IBM Plex Mono',monospace;color:#eb6834;font-variant-numeric:tabular-nums\">0.0%<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"font-size:15.5px;line-height:1.45;color:#dfe5eb;text-wrap:pretty\">of the replies and likes real people gave went to automated-looking accounts.<\u002Fdiv>\n        <div style=\"align-self:flex-start;font:500 11.5px 'IBM Plex Mono',monospace;color:#bfe3cc;background:rgba(79,179,122,.12);border:1px solid rgba(79,179,122,.3);padding:5px 9px;border-radius:999px;white-space:nowrap\">{{ deltaText }}<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"position:relative;flex:1;min-height:190px;margin-top:10px\">\n        <div ref=\"{{ heroWrap }}\" style=\"position:absolute;inset:0\"><canvas ref=\"{{ heroRef }}\" style=\"display:block;width:100%;height:100%\"><\u002Fcanvas><\u002Fdiv>\n        <div style=\"position:absolute;left:0;right:0;bottom:0;padding:10px 24px;background:rgba(11,15,19,.88);border-top:1px solid rgba(220,230,240,.08);display:flex;flex-wrap:wrap;gap:6px 18px;font-size:12px;color:#c3ccd5;pointer-events:none\">\n          <div style=\"display:flex;align-items:center;gap:7px;white-space:nowrap\"><span style=\"width:8px;height:8px;border-radius:50%;background:#5b9ff0;box-shadow:0 0 8px #2a78d6\"><\u002Fspan>Real people<\u002Fdiv>\n          <div style=\"display:flex;align-items:center;gap:7px;white-space:nowrap\"><span style=\"width:8px;height:8px;border-radius:50%;border:1.5px solid #eb6834;background:rgba(235,104,52,.3)\"><\u002Fspan>Lost to automated-looking<\u002Fdiv>\n          <div style=\"font:400 11px 'IBM Plex Mono',monospace;color:#8793a0;white-space:nowrap\">1 figure = 1%<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"flex:1 1 380px;min-width:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px\">\n      <sc-for list=\"{{ tiles }}\" as=\"t\" hint-placeholder-count=\"4\">\n        <div style=\"background:#f8f9fb;border:1px solid rgba(16,22,29,.1);border-radius:12px;padding:16px 18px;display:flex;flex-direction:column;gap:7px;min-width:0\">\n          <div style=\"font:500 10.5px 'IBM Plex Mono',monospace;letter-spacing:.08em;text-transform:uppercase;color:#4d5966\">{{ t.label }}<\u002Fdiv>\n          <div style=\"display:flex;align-items:baseline;gap:6px;flex-wrap:wrap\">\n            <div style=\"font-family:'Instrument Serif',serif;font-size:46px;line-height:1\">{{ t.value }}<\u002Fdiv>\n            <div style=\"font:500 13px 'IBM Plex Mono',monospace;color:#4d5966;white-space:nowrap\">{{ t.unit }}<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"font-size:12.5px;line-height:1.45;color:#4d5966;text-wrap:pretty\">{{ t.sub }}<\u002Fdiv>\n          <sc-if value=\"{{ showChecks }}\" hint-placeholder-val=\"{{ true }}\">\n            <div style=\"display:flex;gap:6px;font:400 10.5px/1.4 'IBM Plex Mono',monospace;color:#4d5966;padding-top:8px;margin-top:auto;border-top:1px solid rgba(16,22,29,.08)\"><span style=\"color:#2a78d6\">✓<\u002Fspan><span>{{ t.check }}<\u002Fspan><\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n\n    <div style=\"flex:1 1 340px;min-width:0;background:#f8f9fb;border:1px solid rgba(16,22,29,.1);border-radius:12px;padding:20px 22px 12px;display:flex;flex-direction:column;gap:8px\">\n      <div style=\"display:flex;flex-direction:column;align-items:flex-start;gap:8px\">\n        <div style=\"font-family:'Instrument Serif',serif;font-size:26px;line-height:1.05\">What changed in the last 24 hours<\u002Fdiv>\n        <div style=\"font:500 10px 'IBM Plex Mono',monospace;letter-spacing:.06em;text-transform:uppercase;color:#4d5966;border:1px solid rgba(16,22,29,.14);padding:4px 7px;border-radius:5px;white-space:nowrap\">By rules, not AI<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));column-gap:24px\">\n        <sc-for list=\"{{ changes }}\" as=\"c\" hint-placeholder-count=\"6\">\n          <div style=\"display:grid;grid-template-columns:20px minmax(0,1fr);gap:8px;padding:8px 0;border-top:1px solid rgba(16,22,29,.07)\">\n            <div style=\"font:500 10.5px 'IBM Plex Mono',monospace;color:#7a8692;padding-top:2px\">{{ c.n }}<\u002Fdiv>\n            <div style=\"font-size:13.5px;line-height:1.42;color:#10161d;text-wrap:pretty\">{{ c.text }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<nav style=\"position:sticky;top:0;z-index:20;background:rgba(238,241,244,.94);backdrop-filter:blur(8px);border-bottom:1px solid rgba(16,22,29,.1);border-top:1px solid rgba(16,22,29,.1);padding:0 clamp(16px,3vw,40px)\">\n  <div style=\"max-width:1440px;margin:0 auto;display:flex;gap:4px;overflow-x:auto\">\n    <sc-for list=\"{{ tabs }}\" as=\"tb\" hint-placeholder-count=\"5\">\n      <button sc-camel-on-click=\"{{ tb.onClick }}\" style=\"flex:none;display:flex;align-items:baseline;gap:10px;background:none;border:none;cursor:pointer;padding:16px 16px 14px;border-bottom:2px solid {{ tb.line }};color:{{ tb.color }};transition:color 300ms,border-color 300ms\">\n        <span style=\"font:500 11px 'IBM Plex Mono',monospace\">{{ tb.num }}<\u002Fspan>\n        <span style=\"font-size:15px;font-weight:500;white-space:nowrap\">{{ tb.q }}<\u002Fspan>\n      <\u002Fbutton>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n<\u002Fnav>\n\n<main style=\"padding:28px clamp(16px,3vw,40px) 64px\">\n<div style=\"max-width:1440px;margin:0 auto;display:flex;flex-direction:column;gap:16px\">\n\n<sc-if value=\"{{ isT4 }}\" hint-placeholder-val=\"{{ false }}\">\n  <div data-screen-label=\"All datasets\" style=\"display:flex;flex-direction:column;gap:16px\">\n    <div style=\"display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px;align-items:flex-end\">\n      <div style=\"display:flex;flex-direction:column;gap:6px;max-width:720px\">\n        <div style=\"font-family:'Instrument Serif',serif;font-size:36px;line-height:1.05\">All datasets<\u002Fdiv>\n        <div style=\"font-size:14px;color:#4d5966;line-height:1.55;text-wrap:pretty\">Every source goes through the same privacy gate, the same score and the same checks. Pick one to filter the whole page, or keep all sources combined, weighted by human engagements.<\u002Fdiv>\n      <\u002Fdiv>\n      <button sc-camel-on-click=\"{{ showAll }}\" style=\"cursor:pointer;font-size:13px;font-weight:500;padding:8px 14px;border-radius:999px;border:1px solid {{ allBtn.border }};background:{{ allBtn.bg }};color:{{ allBtn.color }};white-space:nowrap\">{{ allBtn.label }}<\u002Fbutton>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px\">\n      <sc-for list=\"{{ dsCards }}\" as=\"d\" hint-placeholder-count=\"4\">\n        <div style=\"background:{{ d.bg }};border:1px solid {{ d.border }};box-shadow:{{ d.ring }};border-radius:12px;padding:20px;display:flex;flex-direction:column;gap:12px;transition:box-shadow 300ms\">\n          <div style=\"display:flex;justify-content:space-between;align-items:center;gap:10px\">\n            <div style=\"font-size:18px;font-weight:600\">{{ d.name }}<\u002Fdiv>\n            <div style=\"font:500 10px 'IBM Plex Mono',monospace;letter-spacing:.06em;text-transform:uppercase;padding:3px 7px;border-radius:4px;border:1px solid {{ d.stBorder }};background:{{ d.stBg }};color:{{ d.stColor }};white-space:nowrap\">{{ d.status }}<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"font-size:13px;color:#4d5966;line-height:1.45;min-height:38px\">{{ d.method }}<\u002Fdiv>\n          <div style=\"display:flex;align-items:baseline;gap:10px\">\n            <div style=\"font-family:'Instrument Serif',serif;font-size:46px;line-height:1;white-space:nowrap;flex:none\">1 in {{ d.oneIn }}<\u002Fdiv>\n            <div style=\"font-size:12.5px;color:#4d5966;line-height:1.3\">attention lost<br>last 24 h · {{ d.wb }}<\u002Fdiv>\n          <\u002Fdiv>\n          <svg sc-camel-view-box=\"0 0 300 60\" sc-camel-preserve-aspect-ratio=\"none\" style=\"width:100%;height:56px;display:block\">\n            <line x1=\"0\" x2=\"300\" y1=\"58\" y2=\"58\" style=\"stroke:rgba(16,22,29,.12)\"><\u002Fline>\n            <path d=\"{{ d.spark }}\" style=\"fill:none;stroke:#eb6834;stroke-width:1.6;vector-effect:non-scaling-stroke;stroke-linejoin:round\"><\u002Fpath>\n          <\u002Fsvg>\n          <div style=\"display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 14px;padding-top:10px;border-top:1px solid rgba(16,22,29,.08)\">\n            <sc-for list=\"{{ d.facts }}\" as=\"fa\" hint-placeholder-count=\"6\">\n              <div style=\"display:flex;flex-direction:column;gap:2px;min-width:0\">\n                <div style=\"font:500 10px 'IBM Plex Mono',monospace;letter-spacing:.06em;text-transform:uppercase;color:#4d5966\">{{ fa.k }}<\u002Fdiv>\n                <div style=\"font:500 13px 'IBM Plex Mono',monospace;color:#10161d\">{{ fa.v }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <div style=\"font-size:12px;color:#4d5966;line-height:1.45\">Collects {{ d.collected }}<\u002Fdiv>\n          <button sc-camel-on-click=\"{{ d.onClick }}\" style=\"cursor:pointer;margin-top:auto;font-size:13px;font-weight:500;padding:9px 12px;border-radius:8px;border:1px solid {{ d.btnBorder }};background:{{ d.btnBg }};color:{{ d.btnColor }}\">{{ d.btn }}<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n    <div style=\"display:flex;flex-wrap:wrap;gap:16px;align-items:stretch\">\n      <div style=\"flex:1.2 1 520px;min-width:0;background:#f8f9fb;border:1px solid rgba(16,22,29,.1);border-radius:12px;padding:24px;display:flex;flex-direction:column;gap:14px\">\n        <div style=\"display:flex;flex-direction:column;gap:6px\">\n          <div style=\"font-family:'Instrument Serif',serif;font-size:30px;line-height:1.05\">Attention lost, by source and topic<\u002Fdiv>\n          <div style=\"font-size:14px;color:#4d5966;line-height:1.5\">Average hourly share of human replies and likes that went to automated-looking accounts, {{ H }} hours. Tap a row to filter.<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"overflow-x:auto\">\n          <div style=\"display:grid;grid-template-columns:130px repeat(5,minmax(76px,1fr));gap:6px;min-width:560px\">\n            <div><\u002Fdiv>\n            <sc-for list=\"{{ topicsAll }}\" as=\"th\" hint-placeholder-count=\"5\"><div style=\"font:500 11.5px 'IBM Plex Mono',monospace;color:#4d5966;padding:0 4px 4px\">#{{ th }}<\u002Fdiv><\u002Fsc-for>\n            <sc-for list=\"{{ heat }}\" as=\"hr\" hint-placeholder-count=\"5\">\n              <button sc-camel-on-click=\"{{ hr.onClick }}\" style=\"cursor:pointer;text-align:left;background:none;border:none;padding:0;font-size:13.5px;font-weight:{{ hr.weight }};color:#10161d;display:flex;align-items:center;gap:6px\"><span style=\"width:6px;height:6px;border-radius:50%;background:{{ hr.dot }}\"><\u002Fspan>{{ hr.name }}<\u002Fbutton>\n              <sc-for list=\"{{ hr.cells }}\" as=\"hc\" hint-placeholder-count=\"5\">\n                <div style=\"border-radius:8px;padding:12px 10px;font:500 14px 'IBM Plex Mono',monospace;background:{{ hc.bg }};color:#10161d;box-shadow:{{ hc.ring }}\">{{ hc.v }}<\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"flex:1 1 420px;min-width:0;background:#f8f9fb;border:1px solid rgba(16,22,29,.1);border-radius:12px;padding:24px;display:flex;flex-direction:column;gap:12px\">\n        <div style=\"font-family:'Instrument Serif',serif;font-size:30px;line-height:1.05\">Checks per source<\u002Fdiv>\n        <div style=\"font-size:14px;color:#4d5966;line-height:1.5\">Each source is validated on its own held-out accounts.<\u002Fdiv>\n        <div style=\"overflow-x:auto\">\n          <div style=\"display:grid;grid-template-columns:minmax(110px,1.4fr) repeat(4,minmax(64px,1fr));min-width:440px\">\n            <sc-for list=\"{{ checkHead }}\" as=\"ch\" hint-placeholder-count=\"5\"><div style=\"font:500 10px 'IBM Plex Mono',monospace;letter-spacing:.06em;text-transform:uppercase;color:#4d5966;padding:0 6px 8px 0\">{{ ch }}<\u002Fdiv><\u002Fsc-for>\n            <sc-for list=\"{{ checkRows }}\" as=\"cr\" hint-placeholder-count=\"4\">\n              <sc-for list=\"{{ cr }}\" as=\"cv\" hint-placeholder-count=\"5\"><div style=\"padding:11px 6px 11px 0;border-top:1px solid rgba(16,22,29,.08);font:500 13px 'IBM Plex Mono',monospace;color:#10161d\">{{ cv }}<\u002Fdiv><\u002Fsc-for>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <sc-if value=\"{{ showChecks }}\" hint-placeholder-val=\"{{ true }}\">\n          <div style=\"display:flex;gap:7px;font:400 11.5px/1.5 'IBM Plex Mono',monospace;color:#4d5966;margin-top:auto\"><span style=\"color:#eb6834\">!<\u002Fspan><span>Only Bluesky is collected today (practice stream). Mastodon, Reddit and YouTube are modelled from the Bluesky run to prototype the filter.<\u002Fspan><\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ isT0 }}\" hint-placeholder-val=\"{{ false }}\">\n  <div data-screen-label=\"Tab 1 · Attention lost\" style=\"display:flex;flex-direction:column;gap:16px\">\n    <div style=\"background:#f8f9fb;border:1px solid rgba(16,22,29,.1);border-radius:12px;padding:24px\">\n      <div style=\"display:flex;flex-wrap:wrap;justify-content:space-between;gap:16px;align-items:flex-end;margin-bottom:14px\">\n        <div style=\"display:flex;flex-direction:column;gap:6px;max-width:640px\">\n          <div style=\"font-family:'Instrument Serif',serif;font-size:32px;line-height:1.05\">How much attention is lost, hour by hour<\u002Fdiv>\n          <div style=\"font-size:14px;color:#4d5966;line-height:1.5\">Share of human replies and likes that landed on automated-looking accounts, per topic, over {{ H }} hours. Pick a topic to bring it forward.<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex;gap:6px;flex-wrap:wrap\">\n          <sc-for list=\"{{ topicChips }}\" as=\"tc\" hint-placeholder-count=\"5\">\n            <button sc-camel-on-click=\"{{ tc.onClick }}\" style=\"cursor:pointer;display:flex;align-items:center;gap:7px;font-size:13px;font-weight:500;padding:7px 12px;border-radius:999px;border:1px solid {{ tc.border }};background:{{ tc.bg }};color:{{ tc.color }};transition:background 300ms,color 300ms\">\n              <span style=\"width:8px;height:8px;border-radius:50%;background:{{ tc.dot }}\"><\u002Fspan>#{{ tc.name }}\n            <\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"position:relative\">\n        <svg ref=\"{{ chartRef }}\" sc-camel-view-box=\"0 0 1000 300\" sc-camel-on-mouse-move=\"{{ onChartMove }}\" sc-camel-on-mouse-leave=\"{{ onChartLeave }}\" style=\"width:100%;height:auto;display:block;overflow:visible;cursor:crosshair\">\n          <defs>\n            <pattern id=\"rt-hatch\" width=\"6\" height=\"6\" sc-camel-pattern-units=\"userSpaceOnUse\" sc-camel-pattern-transform=\"rotate(45)\"><rect width=\"1.4\" height=\"6\" style=\"fill:#c9d0d8\"><\u002Frect><\u002Fpattern>\n          <\u002Fdefs>\n          <sc-for list=\"{{ gaps }}\" as=\"g\" hint-placeholder-count "{{ hover.x }}\" y1=\"14\" y2=\"266\" style=\"stroke:#10161d;stroke-width:1;stroke-dasharray:2 3\"><\u002Fline>\n            <sc-if value=\"{{ hover.has }}\" hint-placeholder-val=\"{{ false }}\">\n              <circle cx=\"{{ hover.x }}\" cy=\"{{ hover.y }}\" r=\"4.5\" style=\"fill:#eb6834;stroke:#f8f9fb;stroke-width:2\"><\u002Fcircle>\n            <\u002Fsc-if>\n          <\u002Fsc-if>\n        <\u002Fsvg>\n        <sc-if value=\"{{ hover.on }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"position:absolute;top:6px;left:{{ hover.left }};transform:translateX({{ hover.shift }});pointer-events:none;background:#10161d;color:#f3f6f9;border-radius:8px;padding:8px 10px;display:flex;flex-direction:column;gap:2px;white-space:nowrap\">\n            <div style=\"font:400 11px 'IBM Plex Mono',monospace;color:#9aa6b2\">{{ hover.when }} · #{{ topic }}<\u002Fdiv>\n            <div style=\"font:500 14px 'IBM Plex Mono',monospace\">{{ hover.val }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:6px;margin-top:14px\">\n        <div style=\"display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;font-size:12.5px;color:#4d5966\">\n          <div><strong style=\"font-weight:600;color:#10161d\">Ghost-made trend slots per hour<\u002Fstrong> · {{ ghostTotal }} across {{ H }} hours<\u002Fdiv>\n          <div style=\"font-family:'IBM Plex Mono',monospace;font-size:11.5px\">same time axis as above<\u002Fdiv>\n        <\u002Fdiv>\n        <svg sc-camel-view-box=\"0 0 1000 34\" style=\"width:100%;height:auto;display:block\">\n          <sc-for list=\"{{ ghostBars }}\" as=\"gb\" hint-placeholder-count=\"0\">\n            <rect x=\"{{ gb.x }}\" y=\"{{ gb.y }}\" width=\"{{ gb.w }}\" height=\"{{ gb.h }}\" rx=\"1.5\" style=\"fill:{{ gb.fill }}\"><\u002Frect>\n          <\u002Fsc-for>\n        <\u002Fsvg>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-wrap:wrap;gap:10px 24px; ground:#c3cad2;border-radius:2px\"><\u002Fdiv>\n                  <\u002Fdiv>\n                  <div style=\"display:flex;flex-direction:column;align-items:flex-end;gap:4px\">\n                    <div style=\"font:400 11px 'IBM Plex Mono',monospace;color:#4d5966;white-space:nowrap\">{{ p.when }}<\u002Fdiv>\n                    <div style=\"font:500 10px 'IBM Plex Mono',monospace;color:#4d5966;border:1px solid rgba(16,22,29,.14);padding:1px 5px;border-radius:4px\">{{ p.lang }}<\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"font-size:15.5px;line-height:1.55;color:#10161d;text-wrap:pretty\"><sc-for list=\"{{ p.segs }}\" as=\"sg\" hint-placeholder-count=\"1\"><span style=\"background:{{ sg.bg }};box-shadow:{{ sg.sh }};border-radius:3px\">{{ sg.t }}<\u002Fspan><\u002Fsc-for><\u002Fdiv>\n                <sc-if value=\"{{ p.hasTr }}\" hint-placeholder-val=\"{{ false }}\">\n                  <div style=\"font-size:13px;line-height:1.5;color:#4d5966;font-style:italic\">Translation: {{ p.tr }}<\u002Fdiv>\n                <\u002Fsc-if>\n                <div style=\"display:flex;flex-wrap:wrap;gap:6px\">\n                  <sc-for list=\"{{ p.signals }}\" as=\"sgn\" hint-placeholder-count=\"2\">\n                    <span style=\"flex:none;white-space:nowrap;font:500 10.5px 'IBM Plex Mono',monospace;color:#3b4652;background:#eef1f4;padding:3px 7px;border-radius:4px\">{{ sgn }}<\u002Fspan>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n                <div style=\"display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px 16px;align-items:center;padding-top:10px;border-top:1px solid rgba(16,22,29,.08)\">\n                  <div style=\"display:flex;align-items:center;gap:8px;font:400 11.5px 'IBM Plex Mono',monospace;color:#4d5966\">score<div style=\"width:70px;height:5px;background:rgba(16,22,29,.08);border-radius:3px;overflow:hidden\"><div style=\"height:100%;width:{{ p.scoreW }};background:#eb6834\ cks }}\" hint-placeholder-val=\"{{ true }}\">\n          <div style=\"display:flex;gap:7px;font:400 11.5px/1.5 'IBM Plex Mono',monospace;color:#4d5966;margin-top:4px\"><span style=\"color:#2a78d6\">✓<\u002Fspan><span>Ghost-made = most posts in the slot came from automated-looking accounts. Slots with fewer than 50 people stay blank.<\u002Fspan><\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n      <div style=\"flex:2 1 520px;display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px\">\n        <div style=\"display:flex;flex-direction:column;gap:8px\">\n          <div style=\"font:500 10.5px 'IBM Plex Mono',monospace;letter-spacing:.1em;text-transform:uppercase;color:#4d5966\">Official top three<\u002Fdiv>\n          <sc-for list=\"{{ official }}\" as=\"o\" hint-placeholder-count=\"3\">\n            <div style=\"display:grid;grid-template-columns:28px minmax(0,1fr) auto;align-items:center;gap:10px;padding:14px 14px;border:1px solid {{ o.border }};background:{{ o.bg }};border-radius:10px\">\n              <div style=\"font-family:'Instrument Serif',serif;font-size:26px;line-height:1;color:#4d5966\">{{ o.rank }}<\u002Fdiv>\n              <div style=\"display:flex;flex-direction:column;gap:2px;min-width:0\">\n                <div style=\"font-size:15px;font-weight:500\">{{ o.name }}<\u002Fdiv>\n                <div style=\"font:400 11.5px 'IBM Plex Mono',monospace;color:#4d5966\">{{ o.sub }}<\u002Fdiv>\n              <\u002Fdiv>\n              <sc-if value=\"{{ o.ghost }}\" hint-placeholder-val=\"{{ false }}\">\n                <div style=\"font:500 10.5px 'IBM Plex Mono',monospace;letter-spacing:.06em;text-transform:uppercase;color:#10161d;background:#eb6834;padding:4px 7px;border-radius:5px\">Ghost-made<\u002Fdiv>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:8px\">\n          <div style=\"font:500 10.5px 'IBM Plex Mono',monospace;letter-spacing:.1em;text-transform:uppercase;color:#1d5aa6\">Top three · ghosts removed<\u002Fdiv>\n          <sc-for list=\"{{ realList }}\" as=\"rl\" hint-placeholder-count=\"3\">\n            <div style=\"display:grid;grid-template-columns:28px minmax(0,1fr);align-items:center;gap:10px;padding:14px;border:1px {{ rl.bstyle }} {{ rl.border }};background:{{ rl.bg }};border-radius:10px;min-height:62px\">\n              <div style=\"font-family:'Instrument Serif',serif;font-size:26px;line-height:1;color:#1d5aa6\">{{ rl.rank }}<\u002Fdiv>\n              <div style=\"display:flex;flex-direction:column;gap:2px\">\n                <div style=\"font-size:15px;font-weight:500;color:{{ rl.color }}\">{{ rl.name }}<\u002Fdiv>\n                <div style=\"font:400 11.5px 'IBM Plex Mono',monospace;color:#4d5966\">{{ rl.sub }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ isT1 }}\" hint-placeholder-val=\"{{ false }}\">\n  <div data-screen-label=\"Tab 2 · Who steers whom\" style=\"display:flex;flex-direction:column;gap:16px\">\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px\">\n      <sc-for list=\"{{ langTiles }}\" as=\"lt\" hint-placeholder-count=\"4\">\n        <button sc-camel-on-click=\"{{ lt.onClick }}\" style=\"cursor:pointer;text-align:left;background:{{ lt.bg }};border:1px solid {{ lt.border }};border-radius:12px;padding:18px 20px;display:flex;flex-direction:column;gap:6px;color:#10161d;transition:background 300ms,border-color 300ms\">\n          <div style=\"font:500 10.5px 'IBM Plex Mono',monospace;letter-spacing:.1em;text-transform:uppercase;color:#4d5966\">{{ lt.name }} audience<\u002Fdiv>\n          <div style=\"font-family:'Instrument Serif',serif;font-size:48px;line-height:1\">{{ lt.big }}<\u002Fdiv>\n          <div style=\"font-size:13px;color:#4d5966;line-height ap:7px;font:400 11.5px/1.5 'IBM Plex Mono',monospace;color:#4d5966\"><span style=\"color:#2a78d6\">✓<\u002Fspan><span>A turn = moves more than 0.3 from its opening level and stays for 4 h. \"Came before\" is timing, not proof of cause. {{ moodCheck }}<\u002Fspan><\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ isT2 }}\" hint-placeholder-val=\"{{ false }}\">\n  <div data-screen-label=\"Tab 3 · Where from, where to\" style=\"display:flex;flex-direction:column;gap:16px\">\n    <div style=\"display:flex;flex-wrap:wrap;gap:16px;align-items:stretch\">\n      <div style=\"flex:1.7 1 640px;min-width:0;background:#f8f9fb;border:1px solid rgba(16,22,29,.1);border-radius:12px;padding:24px;display:flex;flex-wrap:wrap;gap:24px\">\n        <div style=\"flex:1.2 1 340px;min-width:0;display:flex;flex-direction:column;gap:14px\">\n          <div style=\"display:flex;flex-direction:column;gap:6px\">\n            <div style=\"font-family:'Instrument Serif',serif;font-size:32px;line-height:1.05\">Where they sleep<\u002Fdiv>\n            <div style=\"font-size:14px;color:#4d5966;line-height:1.5\">Estimated from each account's quiet hours. Hover a region to find it on the globe.<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex;gap:4px;background:#e6eaee;border-radius:999px;padding:3px;align-self:flex-start\">\n            <sc-for list=\"{{ langSeg }}\" as=\"ls\" hint-placeholder-count=\"4\">\n              <button sc-camel-on-click=\"{{ ls.onClick }}\" style=\"cursor:pointer;border:none;border-radius:999px;padding:6px 12px;font-size:13px;font-weight:500;background:{{ ls.bg }};color:{{ ls.color }};transition:background 300ms\">{{ ls.name }}<\u002Fbutton>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:2px\">\n            <sc-for list=\"{{ sleepRows }}\" as=\"sr\" hint-placeholder-count=\"6\">\n              <div sc-camel-on-mouse- ction:column;gap:6px;max-width:680px\">\n          <div style=\"font-family:'Instrument Serif',serif;font-size:32px;line-height:1.05\">The campaign, end to end<\u002Fdiv>\n          <div style=\"font-size:14px;color:#4d5966;line-height:1.5\">{{ flowN }} automated-looking accounts in #election: where they sleep, which audience they write to and which way they push it, and how many real people they replied to. Counts only, never names.<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"font:400 11.5px 'IBM Plex Mono',monospace;color:#4d5966\">each dot ≈ 5 accounts in motion<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"overflow-x:auto\">\n        <div style=\"position:relative;min-width:760px;aspect-ratio:1000/430\">\n          <svg sc-camel-view-box=\"0 0 1000 430\" style=\"position:absolute;inset:0;width:100%;height:100%;display:block\">\n            <text x=\"{{ flow.X0e }}\" y=\"20\" style=\"font:500 10.5px 'IBM Plex Mono',monospace;letter-spacing:.1em;fill:#4d5966;text-anchor:end\">WHERE THEY SLEEP<\u002Ftext>\n            <text x=\"{{ flow.X1 }}\" y=\"20\" style=\"font:500 10.5px 'IBM Plex Mono',monospace;letter-spacing:.1em;fill:#4d5966\">AUDIENCE · DIRECTION PUSHED<\u002Ftext>\n            <text x=\"{{ flow.X2 }}\" y=\"20\" style=\"font:500 10.5px 'IBM Plex Mono',monospace;letter-spacing:.1em;fill:#4d5966\">REAL PEOPLE REPLIED TO<\u002Ftext>\n            <sc-for list=\"{{ flow.r1 }}\" as=\"r\" hint-placeholder-count=\"0\"><path d=\"{{ r.d }}\" style=\"fill:rgba(235,104,52,.2)\"><\u002Fpath><\u002Fsc-for>\n            <sc-for list=\"{{ flow.r2 }}\" as=\"r\" hint-placeholder-count=\"0\"><path d=\"{{ r.d }}\" style=\"fill:rgba(42,120,214,.14)\"><\u002Fpath><\u002Fsc-for>\n            <sc-for list=\"{{ flow.origins }}\" as=\"o\" hint-placeholder-count=\"0\">\n              <rect x=\"{{ flow.X0 }}\" y=\"{{ o.y0 }}\" width=\"12\" height=\"{{ o.h }}\" rx=\"2\" style=\"fill:#eb6834\"><\u002Frect>\n              <text x=\"{{ o.lx }}\" y=\"{{ o.ly }}\" style=\"fo
